[package]
name        = "appspec"
version     = "0.4.5"
edition     = "2021"
rust-version = "1.74"
description = "Apptainer SIF builder from TOML spec + composable bundles"
license     = "GPL-2.0-or-later"
readme      = "README.md"
repository  = "https://example.invalid/appspec"   # поправьте под свой remote
keywords    = ["apptainer", "singularity", "sif", "container", "build"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "appspec"
path = "src/main.rs"

[dependencies]
# --- E10: TLS для repo serve ---
rustls        = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
# --- CLI -------------------------------------------------------------------
clap        = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"

# --- error handling --------------------------------------------------------
anyhow      = "1"

# --- serialization ---------------------------------------------------------
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# --- templates (Dockerfile.*.j2, run*.sh.j2, launcher.sh.j2, app.desktop.j2)
minijinja   = { version = "2", features = ["loader", "json"] }

# --- TOML-редактирование с сохранением комментариев -----------------------
# Используется в `appspec bundle add/remove` (в этом релизе — только
# подготовлено; в codegen не задействовано).
toml_edit   = "0.22"

# --- misc ------------------------------------------------------------------
base64 = "0.23"

# --- hashing для метаданных SIF: sha256 содержимого .appspec ---------------
sha2   = "0.10"

# --- E1 (repo): flock для <root>/.lock -------------------------------------
libc   = "0.2"

# --- E5: ed25519 подписи index.json ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core     = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
# --- E10: генерация self-signed для тестов ---
rcgen = "0.13"
# --- тесты -----------------------------------------------------------------
tempfile    = "3"
assert_cmd  = "2"
predicates  = "3"

# ---------------------------------------------------------------------------
# Профили сборки
# ---------------------------------------------------------------------------

[profile.release]
opt-level     = "z"
lto           = true
strip         = true
codegen-units = 1
panic         = "abort"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[package.metadata.rebuild-on-change]
paths = ["templates/**", "config/**"]
