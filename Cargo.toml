[package]
name        = "appspec"
version     = "0.3.5"
edition     = "2021"
rust-version = "1.74"
description = "Apptainer SIF builder from TOML spec + composable bundles"
license     = "MIT"
readme      = "README.md"
repository  = "https://example.invalid/appspec"   # поправьте под свой remote
keywords    = ["apptainer", "singularity", "sif", "container", "build"]
categories  = ["command-line-utilities", "development-tools"]

[[bin]]
name = "appspec"
path = "src/main.rs"

[dependencies]
# --- CLI -------------------------------------------------------------------
clap        = { version = "4", features = ["derive", "env", "wrap_help"] }

# --- error handling --------------------------------------------------------
anyhow      = "1"

# --- serialization ---------------------------------------------------------
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# --- templates (Dockerfile.*.j2, run*.sh.j2, launcher.sh.j2, app.desktop.j2)
minijinja   = { version = "2", features = ["loader", "json"] }

# --- TOML-редактирование с сохранением комментариев -----------------------
# Используется в `appspec bundle add/remove` (в этом релизе — только
# подготовлено; в codegen не задействовано).
toml_edit   = "0.22"

# --- misc ------------------------------------------------------------------
# Понадобится, если добавим работу с mtime в коде (сейчас — только shell).
# filetime    = "0.2"

base64 = "0.23"


[dev-dependencies]
# --- тесты -----------------------------------------------------------------
tempfile    = "3"
assert_cmd  = "2"
predicates  = "3"

# ---------------------------------------------------------------------------
# Профили сборки
# ---------------------------------------------------------------------------

[profile.release]
opt-level     = "z"
lto           = true
strip         = true
codegen-units = 1
panic         = "abort"

# Профиль для `cargo test --release`, если понадобится.
[profile.bench]
inherits = "release"

# Быстрая сборка dev-режима (magicpak-шаблоны тяжёлые по include_str!).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# ---------------------------------------------------------------------------
# Особенности сборки
# ---------------------------------------------------------------------------

# Шаблоны вкомпилированы через include_str!("../templates/..."). Чтобы
# `cargo build` пересобирался при их правке без `cargo clean`, добавляем
# явную отслеживаемую зависимость от каталога.
[package.metadata.rebuild-on-change]
paths = ["templates/**", "config/**"]